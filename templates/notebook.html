<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>筆記頁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<!--
  Epi_Yaxin 筆記頁模板（epi-notebook）
  - HTML 只是外殼；標題、卡片、卡片的上下層與順序全部是資料。
  - 資料存在 indexedDB（名稱見 nb-config 的 db）的 store 'kv'、key 'doc'，Epi_Yaxin Library 會同步到 GitHub 的 .data.json。
  - nb-seed 是作者預先放的內容：只在第一次打開時建成卡片；之後新版只補「沒見過的」卡片，不會覆蓋或復活你改過、刪過的。
-->
<script id="nb-config" type="application/json">{"db":"__NB_DB__","title":"__NB_TITLE__"}</script>
<script id="nb-seed" type="application/json">null</script>
<style>
:root{
  color-scheme:light only;
  --bg:#F7F3EA;--surface:#FFFFFF;--surface-2:#FBF8F2;
  --cream:#E8E2D3;--cream-soft:#F0EADC;
  --ink:#232019;--muted:#6E6A60;--faint:#9C978B;
  --line:#E3DED2;--line-strong:#CFC9BA;
  --wine:#8A2E3B;--clay:#A8483B;
  --ac:#3E6B4E;--ac-soft:#E7EEE8;--ac-mid:#C8D8CC;
  --sans:"IBM Plex Sans","Noto Sans TC",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --fs:1;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
input,textarea,select{font-family:inherit;font-size:15px;color:var(--ink)}
a{color:var(--ac)}
#app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}

/* ---------- 左欄：根目錄 ---------- */
#side{background:var(--cream-soft);border-right:1px solid var(--line);padding:22px 14px 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
.st{font-size:19px;font-weight:700;line-height:1.35;margin:0 6px 2px;cursor:pointer;word-break:break-word}
.ss{font-size:12.5px;color:var(--muted);margin:0 6px 12px;line-height:1.5;word-break:break-word}
.fsr{display:flex;align-items:center;gap:6px;margin:0 6px 12px;font-size:12px;color:var(--muted)}
.fsr button{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:1px 7px;font-size:12px}
.srch{position:relative;margin:0 2px 12px}
.srch input{width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:7px 28px 7px 10px;background:var(--surface);font-size:13.5px}
.srch .clr{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--faint);font-size:13px;padding:4px 6px;display:none}
.srch.has .clr{display:block}
.tlab{font-size:11.5px;color:var(--faint);letter-spacing:.06em;margin:4px 8px 4px}
.tn{display:flex;align-items:center;gap:2px;border-radius:7px;padding:0 4px 0 calc(4px + var(--d,0) * 14px);min-height:32px}
.tn:hover{background:rgba(0,0,0,.035)}
.tn.sel{background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.tn .tg{border:0;background:none;color:var(--faint);width:20px;height:24px;padding:0;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.tn .tg svg{transition:transform .15s;transform:rotate(-90deg)}
.tn .tg[aria-expanded="true"] svg{transform:none}
.tn .tg.no{visibility:hidden}
.tn .tt{flex:1;min-width:0;font-size:14px;line-height:1.4;padding:5px 2px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tn.sel .tt{font-weight:600}
.tn .tc{font-size:11px;color:var(--faint);font-family:var(--mono);padding-right:4px}
.tn.home .tt{padding-left:4px}
.tn[data-tn]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.tn .tm{border:0;background:none;color:var(--faint);width:24px;height:24px;padding:0;border-radius:6px;opacity:0;flex:0 0 auto;font-size:15px;line-height:1}
.tn:hover .tm,.tn.menu .tm,.tn .tm:focus-visible{opacity:1}
.tn .tm:hover{color:var(--ac);background:rgba(0,0,0,.05)}
@media(hover:none){.tn .tm{display:none}}
.tn.menu{background:var(--surface);box-shadow:0 0 0 1px var(--line-strong)}
.tn.dz-before{box-shadow:inset 0 2px 0 var(--ac)}
.tn.dz-after{box-shadow:inset 0 -2px 0 var(--ac)}
.tn.dz-into{background:var(--ac-soft);box-shadow:0 0 0 1px var(--ac-mid)}
.tn.dragging{opacity:.45}
.tmenu{position:fixed;z-index:55;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:6px;min-width:190px;display:none}
.tmenu.on{display:block}
.tmenu .mt{font-size:12px;color:var(--muted);padding:3px 10px 7px;border-bottom:1px solid var(--line);margin-bottom:4px;max-width:250px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmenu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:7px;font-size:14px}
.tmenu button:hover:not(:disabled){background:var(--surface-2);color:var(--ac)}
.tmenu button:disabled{opacity:.35;cursor:default}
.mvdlg{position:fixed;inset:0;background:rgba(20,18,14,.35);z-index:58;display:none;align-items:center;justify-content:center;padding:16px}
.mvdlg.on{display:flex}
.mvdlg .box{background:var(--surface);border-radius:12px;padding:16px 18px 14px;width:min(460px,100%);box-shadow:0 12px 40px rgba(0,0,0,.2)}
.mvdlg .mvt{font-weight:600;margin-bottom:12px;word-break:break-word}
.place{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.place .f{margin-bottom:11px}
@media(max-width:560px){.place{grid-template-columns:1fr;gap:0}}
.tadd{border:0;background:none;color:var(--muted);font-size:13.5px;padding:8px 10px;margin-top:4px}
.tadd:hover{color:var(--ac)}

/* ---------- 右欄 ---------- */
#main{padding:26px 40px 80px;font-size:calc(15px * var(--fs));max-width:980px;width:100%}
#top{display:none}
#scrim{display:none}
.crumb{font-size:.82em;color:var(--muted);margin:0 0 6px;padding-right:44px;line-height:1.6}
.crumb a{color:var(--muted);text-decoration:none;cursor:pointer}
.crumb a:hover{color:var(--ac)}
.crumb .sep{color:var(--faint);margin:0 6px}
.hd{display:flex;align-items:flex-start;gap:6px}
.hd h1{flex:1;min-width:0;font-size:1.6em;font-weight:700;line-height:1.3;margin:0;word-break:break-word}
.hd .sub{color:var(--muted);font-size:.9em;margin-top:4px}
.ib{border:0;background:none;color:var(--muted);font-size:1.05em;line-height:1;padding:6px 7px;min-width:32px;min-height:32px;border-radius:7px;flex:0 0 auto}
.ib:hover{color:var(--ac)}
.ib.del:hover{color:var(--clay)}
.ib.info{font-family:Georgia,serif;font-style:italic;font-weight:700}
.ib[aria-pressed="true"]{color:var(--ac);background:var(--ac-soft)}
.tip{display:none;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:.87em;line-height:1.75;color:var(--muted);margin:12px 0 0}
.tip.on{display:block}
.tip ul{margin:0;padding-left:1.15em}
.tip strong{color:var(--ink)}
.body{margin-top:14px}
.empty{color:var(--faint);font-size:.9em;padding:14px 0}
.banner{background:#F6E7E4;border:1px solid #EBCBC5;color:var(--clay);border-radius:8px;padding:8px 12px;font-size:13px;margin:0 0 14px}

/* Markdown */
.md{line-height:1.75;word-break:break-word}
.md>*:first-child{margin-top:0}
.md h1,.md h2{font-size:1.2em;margin:1.2em 0 .5em}
.md h3,.md h4{font-size:1.05em;margin:1.1em 0 .4em}
.md p{margin:.55em 0}
.md ul,.md ol{margin:.4em 0;padding-left:1.4em}
.md li{margin:.15em 0}
.md li>input[type=checkbox]{margin:0 .45em 0 -.15em;transform:translateY(1px);accent-color:var(--ac);cursor:pointer}
.md li:has(>input[type=checkbox]){list-style:none;margin-left:-1.1em}
.md li:has(>input:checked){color:var(--faint);text-decoration:line-through}
.md blockquote{margin:.6em 0;padding:.2em 0 .2em .9em;border-left:3px solid var(--line-strong);color:var(--muted)}
.md code{font-family:var(--mono);font-size:.88em;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.md pre{position:relative;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;font-size:.86em;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.md pre code{border:0;background:none;padding:0;font-size:1em}
.md pre .cp{position:absolute;top:6px;right:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;font-size:12px;padding:2px 8px;color:var(--muted)}
.md pre .cp:hover{color:var(--ac)}
.md .tw{overflow-x:auto;margin:.6em 0;position:relative}
.md table{border-collapse:collapse;font-size:.92em;min-width:60%}
.md th,.md td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top;word-break:normal;overflow-wrap:break-word;min-width:7em}
.md th{background:var(--surface-2);font-weight:600}
.md hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
.md img{max-width:100%}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:4px 0;position:relative}

/* 圖片 */
.imgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.im{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0;overflow:hidden;width:120px;text-align:left;cursor:zoom-in}
.im img{display:block;width:100%;height:84px;object-fit:cover;background:#fff}
.im span{display:block;font-size:11.5px;color:var(--muted);padding:3px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 底下的卡片 */
.kh{display:flex;align-items:center;gap:6px;margin:30px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.kh .kl{font-size:.82em;color:var(--muted);letter-spacing:.04em}
.kh .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);font-size:12.5px;padding:3px 10px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 15px 11px;cursor:pointer;display:flex;flex-direction:column;gap:5px;min-width:0;transition:border-color .15s}
.kc:hover{border-color:var(--line-strong)}
.kt{font-weight:600;line-height:1.4;word-break:break-word}
.kx2{color:var(--muted);font-size:.86em;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.km{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:3px}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-family:var(--mono)}
.dot{font-size:9px;color:var(--faint);margin-right:7px;vertical-align:2px}
.dot.w{color:var(--wine)}
.ro{display:flex;gap:4px;margin-left:auto}
.ro button{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;font-size:12px;padding:1px 8px;color:var(--muted)}
.ro button:disabled{opacity:.35;cursor:default}
.list{display:flex;flex-direction:column;gap:8px}
.lr{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.lh{display:flex;align-items:center;gap:6px;padding:10px 12px 10px 14px;cursor:pointer}
.lh .lt{flex:1;min-width:0;line-height:1.45;word-break:break-word}
.lr.open .lh .lt{font-weight:600}
.lb2{padding:2px 16px 14px 30px;border-top:1px solid var(--line)}
.lb2 .md{margin-top:10px}
.la{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
.cx{border:0;background:none;color:var(--faint);font-size:13px;padding:3px 6px;border-radius:6px;flex:0 0 auto}
.cx:hover{color:var(--ac)}
.cx.del:hover{color:var(--clay)}

/* 表單 */
.form{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:6px 0 4px}
.lr .form{border:0;border-radius:0;margin:0;padding:12px 14px 14px}
.f{display:block;margin-bottom:11px}
.f>span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.f input,.f textarea,.f select{width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;background:var(--surface);font-size:15px}
.f input:focus,.f textarea:focus,.f select:focus,.srch input:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 2px var(--ac-soft)}
.f textarea{font-family:var(--mono);font-size:13.5px;line-height:1.6;min-height:180px;resize:vertical}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);margin:0 0 11px;cursor:pointer}
.chk input{accent-color:var(--ac);width:16px;height:16px;margin:0}
.fold{margin-top:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.fbar{display:flex;align-items:center;gap:6px;width:100%;border:0;background:none;padding:9px 12px 9px 14px;text-align:left;cursor:pointer;font-size:1em}
.fbar .fl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:.9em}
.fold.open .fbar .fl{color:var(--ink);font-weight:600}
.fbar .kx{color:var(--faint);line-height:0;padding:0 2px;margin-left:4px}
.fbar:hover .kx{color:var(--ac)}
.fbar .kx svg{display:block;transition:transform .2s}
.fold.open .fbar .kx svg{transform:rotate(180deg)}
.fold .body{margin:0;padding:2px 16px 14px;border-top:1px solid var(--line)}
.fold .body .md{margin-top:12px}
.drop{border:1.5px dashed var(--line-strong);border-radius:9px;padding:10px 12px;color:var(--muted);font-size:13px;cursor:pointer;text-align:center}
.drop.over{border-color:var(--ac);background:var(--ac-soft);color:var(--ac)}
.fim{display:flex;align-items:center;gap:8px;margin-top:7px}
.fim img{width:56px;height:42px;object-fit:cover;border:1px solid var(--line);border-radius:6px;background:#fff;flex:0 0 auto}
.fim input{flex:1;min-width:0;border:1px solid var(--line-strong);border-radius:7px;padding:5px 8px;font-size:13px}
.fa{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:7px 16px;font-weight:500;font-size:14px}
.btn.ghost{background:transparent;color:var(--ac);border:1px solid var(--line-strong)}

/* 長按刪除 */
[data-hold]{background-image:linear-gradient(var(--clay),var(--clay))!important;background-repeat:no-repeat!important;background-size:0% 100%!important;background-position:left center!important;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
[data-hold].on{background-size:100% 100%!important;transition:background-size 1.5s linear;color:#fff!important}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:20px;font-size:13.5px;z-index:50;opacity:0;pointer-events:none;transition:opacity .25s;display:flex;gap:12px;align-items:center;max-width:calc(100vw - 32px)}
.toast.on{opacity:1}
.toast.act{pointer-events:auto}
.toast button{border:0;background:none;color:#B9E0C6;font-weight:600;padding:0}
.lbx{position:fixed;inset:0;background:rgba(20,18,14,.86);z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:20px}
.lbx.on{display:flex}
.lbx img{max-width:100%;max-height:calc(100vh - 90px);background:#fff;border-radius:4px}
.lbx .cap{color:#eee;font-size:13.5px}
.lbx .nv{position:absolute;top:50%;transform:translateY(-50%);border:0;background:rgba(255,255,255,.14);color:#fff;font-size:24px;width:44px;height:44px;border-radius:50%}
.lbx .pv{left:14px}.lbx .nx{right:14px}

@media(max-width:760px){
  #app{display:block}
  #side{position:fixed;inset:0 auto 0 0;width:84vw;max-width:320px;z-index:40;transform:translateX(-102%);transition:transform .2s}
  body.drawer #side{transform:none;box-shadow:0 0 30px rgba(0,0,0,.18)}
  #scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:39}
  body.drawer #scrim{display:block}
  #top{display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 16px;padding-right:56px}
  #top .ib{font-size:18px}
  #top .tt2{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #main{padding:16px 16px 70px}
  .crumb{padding-right:0}
  .grid{grid-template-columns:1fr}
  .lb2{padding-left:16px}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="st" id="sTitle"></div>
    <div class="ss" id="sSub"></div>
    <div class="fsr">字級 <button id="fsDn" title="縮小">A−</button><span id="fsV">100%</span><button id="fsUp" title="放大">A+</button></div>
    <div class="srch" id="srchBox"><input type="text" id="q" placeholder="搜尋卡片…" autocomplete="off"><button class="clr" id="qClr" title="清除">✕</button></div>
    <div class="tlab">目錄</div>
    <nav id="tree"></nav>
    <button class="tadd" id="addRoot">＋ 卡片</button>
  </aside>
  <div id="scrim"></div>
  <div>
    <div id="top"><button class="ib" id="menuBtn" title="目錄">☰</button><span class="tt2" id="topTitle"></span></div>
    <main id="main"></main>
  </div>
</div>
<div class="lbx" id="lbx"><button class="nv pv" id="lbPrev">‹</button><img id="lbImg" alt=""><div class="cap" id="lbCap"></div><button class="nv nx" id="lbNext">›</button></div>
<div class="tmenu" id="tmenu"></div>
<div class="mvdlg" id="mvdlg"><div class="box"><div class="mvt" id="mvTitle"></div>
  <div class="place"><label class="f"><span>放在哪張卡片底下</span><select id="mvParent"></select></label>
  <label class="f"><span>位置</span><select id="mvPos"></select></label></div>
  <div class="fa"><button class="btn ghost" type="button" id="mvCancel">取消</button><button class="btn" type="button" id="mvOk">移過去</button></div></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="filePick" accept="image/*" multiple style="display:none">
<script>
'use strict';
/* ================= 設定與小工具 ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=v=>JSON.parse(JSON.stringify(v));
const NOW=()=>Date.now();
const uid=()=>NOW().toString(36)+Math.random().toString(36).slice(2,7);
const readJSON=id=>{try{return JSON.parse(document.getElementById(id).textContent)}catch(e){return null}};
const CFG=readJSON('nb-config')||{};
const SEED=readJSON('nb-seed');
const real=v=>typeof v==='string'&&v&&!/^__NB_/.test(v);
const DBN=real(CFG.db)?CFG.db:'nb-template';
const LSK='nb:'+DBN+':';
const CHEV='<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5L12 11L18 5"/><path d="M6 12L12 18L18 12"/></svg>';
const lsGet=(k,d)=>{try{const v=localStorage.getItem(LSK+k);return v==null?d:JSON.parse(v)}catch(e){return d}};

/* ================= 存檔：indexedDB（Epi_Yaxin 會同步），不行時退到 localStorage／記憶體 ================= */
const Store={mode:'idb',_db:null,mem:{},
  open(){
    if(this._db)return Promise.resolve(this._db);
    return new Promise((res,rej)=>{
      let r;try{r=indexedDB.open(DBN)}catch(e){rej(e);return}
      r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('kv'))r.result.createObjectStore('kv')};
      r.onsuccess=()=>{const db=r.result;
        if(db.objectStoreNames.contains('kv')){this._db=db;res(db);return}
        const v=db.version+1;db.close();
        const r2=indexedDB.open(DBN,v);r2.onupgradeneeded=()=>r2.result.createObjectStore('kv');
        r2.onsuccess=()=>{this._db=r2.result;res(r2.result)};r2.onerror=()=>rej(r2.error)};
      r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));
    });
  },
  async get(k){
    try{const db=await this.open();return await new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
    catch(e){this.mode='ls';try{const v=localStorage.getItem(LSK+'store:'+k);return v?JSON.parse(v):undefined}catch(_){this.mode='mem';return this.mem[k]}}
  },
  async set(k,v){
    if(this.mode==='idb'){try{const db=await this.open();await new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)});return true}catch(e){this.mode='ls'}}
    if(this.mode==='ls'){try{localStorage.setItem(LSK+'store:'+k,JSON.stringify(v));return true}catch(e){this.mode='mem'}}
    this.mem[k]=clone(v);return false;
  }
};

function blankNode(){const t=NOW();return{id:uid(),title:'',body:'',imgs:[],kids:[],view:'grid',created:t,updated:t}}
function fixNode(n,id){
  n.id=id;n.title=typeof n.title==='string'?n.title:String(n.title||'');n.body=typeof n.body==='string'?n.body:String(n.body||'');
  n.imgs=Array.isArray(n.imgs)?n.imgs.filter(g=>g&&g.src):[];n.kids=Array.isArray(n.kids)?n.kids:[];
  n.view=n.view==='list'?'list':'grid';n.fold=!!n.fold;n.created=n.created||NOW();n.updated=n.updated||n.created;return n;
}
/* 修正上下層：重複、斷掉的引用拿掉；找不到上層的卡片放到首頁最後面（不會不見） */
function normalize(d){
  if(!d.nodes||typeof d.nodes!=='object')d.nodes={};
  Object.keys(d.nodes).forEach(id=>{if(!d.nodes[id]||typeof d.nodes[id]!=='object')delete d.nodes[id];else fixNode(d.nodes[id],id)});
  ['kids','seeded','trash','movesDone'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});
  if(!d.seedAt||typeof d.seedAt!=='object'||Array.isArray(d.seedAt))d.seedAt={};
  Object.keys(d.seedAt).forEach(id=>{if(!d.nodes[id]||typeof d.seedAt[id]!=='string')delete d.seedAt[id]});
  d.title=typeof d.title==='string'?d.title:'';d.sub=typeof d.sub==='string'?d.sub:'';d.about=typeof d.about==='string'?d.about:'';
  d.view=d.view==='list'?'list':'grid';d.fold=!!d.fold;
  const seen=new Set();
  const fix=arr=>arr.filter(id=>{if(!d.nodes[id]||seen.has(id))return false;seen.add(id);return true});
  const walk=arr=>{const out=fix(arr);out.forEach(id=>{d.nodes[id].kids=walk(d.nodes[id].kids)});return out};
  d.kids=walk(d.kids);
  Object.keys(d.nodes).forEach(id=>{if(!seen.has(id)){seen.add(id);d.kids.push(id);d.nodes[id].kids=walk(d.nodes[id].kids)}});
  const cut=NOW()-30*864e5;d.trash=d.trash.filter(t=>t&&t.at>cut);
  return d;
}
/* 作者內容：沒見過的卡片才加，放在 seed 裡的上層（上層被刪了就放首頁最後） */
function mergeSeed(d,seed){
  if(!seed||!seed.nodes)return false;let ch=false;const has=new Set(d.seeded);
  const add=(pid,ids)=>(ids||[]).forEach((id,i)=>{
    const sn=seed.nodes[id];if(!sn)return;
    if(!has.has(id)){has.add(id);d.seeded.push(id);ch=true;
      if(!d.nodes[id]){d.nodes[id]=fixNode(Object.assign(blankNode(),clone(sn),{kids:[]}),id);
        const par=pid==null?null:d.nodes[pid];const arr=pid==null?d.kids:(par?par.kids:d.kids);
        if(pid!=null&&!par)arr.push(id);else arr.splice(Math.min(i,arr.length),0,id);
        d.seedAt[id]=par?pid:''}}
    add(id,sn.kids);
  });
  add(null,seed.kids);return ch;
}
/* 作者搬卡片（seed.moves）：{"卡片": "目的地"} 或 {"卡片": {"to":"目的地","from":"現在的上層"}}，""＝首頁
   只在「卡片還在模板放的位置、使用者沒搬到別處」時搬，每條只做一次（記在 movesDone） */
function applyMoves(d,seed){
  const mv=seed&&seed.moves;if(!mv||typeof mv!=='object'||Array.isArray(mv))return false;
  const par={};d.kids.forEach(k=>par[k]='');Object.keys(d.nodes).forEach(i=>d.nodes[i].kids.forEach(k=>par[k]=i));
  const done=new Set(d.movesDone);let ch=false;
  const mark=k=>{if(!done.has(k)){done.add(k);d.movesDone.push(k);ch=true}};
  const under=(a,b)=>{let c=par[b];while(c){if(c===a)return true;c=par[c]}return false};
  Object.keys(mv).forEach(card=>{
    let sp=mv[card];if(typeof sp==='string')sp={to:sp};if(!sp||typeof sp!=='object')return;
    const to=sp.to==null?'':String(sp.to),key=card+'>'+to;
    if(done.has(key)||!d.nodes[card])return;
    const cp=par[card]===undefined?'':par[card];
    if(cp===to){mark(key);return}
    const at=Object.prototype.hasOwnProperty.call(d.seedAt,card)?d.seedAt[card]:undefined;
    const from=sp.from==null?null:String(sp.from);
    const ok=at!==undefined?(at===cp&&(from==null||from===cp)):(from!=null&&from===cp);
    if(!ok){mark(key);return}
    if(to&&!d.nodes[to])return;
    if(to&&(to===card||under(card,to))){mark(key);return}
    const src=cp?d.nodes[cp].kids:d.kids;src.splice(src.indexOf(card),1);
    const arr=to?d.nodes[to].kids:d.kids,order=(to?(seed.nodes&&seed.nodes[to]&&seed.nodes[to].kids):seed.kids)||[];
    let idx=arr.length;const k=order.indexOf(card);
    if(k>=0){let f=-1;for(let j=k-1;j>=0&&f<0;j--)f=arr.indexOf(order[j]);
      if(f>=0)idx=f+1;else{for(let j=k+1;j<order.length;j++){const g=arr.indexOf(order[j]);if(g>=0){idx=g;break}}}}
    arr.splice(idx,0,card);par[card]=to;d.seedAt[card]=to;mark(key);ch=true;
  });
  return ch;
}

/* ================= Markdown ================= */
function stripFence(src){const t=src.trim();const m=t.match(/^```(?:markdown|md)?[ \t]*\r?\n([\s\S]*?)\r?\n```\s*$/i);return m?m[1]:src}
function renderMD(src){
  src=stripFence(src||'');const math=[];
  const keep=(tex,display)=>{math.push({tex,display});return '@@MATH'+(math.length-1)+'@@'};
  src=protectMath(src,keep);
  let html;
  if(window.marked){html=marked.parse(src,{gfm:true,breaks:true});if(window.DOMPurify)html=DOMPurify.sanitize(html)}
  else html=src.split(/\n{2,}/).map(p=>'<p>'+esc(p).replace(/\n/g,'<br>')+'</p>').join('');
  return html.replace(/@@MATH(\d+)@@/g,(m,i)=>{const x=math[+i];
    if(window.katex){try{return katex.renderToString(x.tex,{displayMode:x.display,throwOnError:false})}catch(e){}}
    return esc(x.display?'$$'+x.tex+'$$':'$'+x.tex+'$')});
}
/* 公式先換成記號再交給 marked；程式碼區塊與行內程式碼裡的 $ 不動 */
function mathText(t,keep){
  return t.split(/(`[^`\n]*`)/).map((p,i)=>i%2?p:p.replace(/\$\$([\s\S]+?)\$\$/g,(m,x)=>keep(x,true)).replace(/\\\[([\s\S]+?)\\\]/g,(m,x)=>keep(x,true))
    .replace(/\\\(([\s\S]+?)\\\)/g,(m,x)=>keep(x,false)).replace(/\$(?!\s)([^$\n]+?)\$/g,(m,x)=>keep(x,false))).join('');
}
function protectMath(src,keep){
  const out=[];let buf=[],fence=null;
  const flush=()=>{if(buf.length){out.push(mathText(buf.join('\n'),keep));buf=[]}};
  src.split('\n').forEach(l=>{
    const m=l.match(/^\s{0,3}(`{3,}|~{3,})/);
    if(fence){out.push(l);if(m&&m[1][0]===fence[0]&&m[1].length>=fence.length&&/^\s*(`{3,}|~{3,})\s*$/.test(l))fence=null;return}
    if(m){flush();fence=m[1];out.push(l);return}
    buf.push(l);
  });
  flush();return out.join('\n');
}
function mdHTML(src,owner){return '<div class="md" data-owner="'+esc(owner)+'">'+renderMD(src)+'</div>'}
function enhance(root){
  root.querySelectorAll('.md').forEach(d=>{

    d.querySelectorAll('table').forEach(t=>{if(t.parentElement.classList.contains('tw'))return;const w=document.createElement('div');w.className='tw';t.replaceWith(w);w.append(t)});
    d.querySelectorAll('a').forEach(a=>{const h=a.getAttribute('href')||'';if(!h.startsWith('#')){a.target='_blank';a.rel='noopener'}});

  });
}
/* 待辦：- [ ] 與 - [x]（略過程式碼區塊） */
function taskIdx(body){
  const lines=body.split('\n');const idx=[];let inF=false;
  const wrapped=/^```(?:markdown|md)?[ \t]*\r?\n[\s\S]*\r?\n```\s*$/i.test(body.trim());
  let first=lines.findIndex(l=>l.trim()),last=lines.length-1;while(last>0&&!lines[last].trim())last--;
  lines.forEach((l,i)=>{
    if(wrapped&&(i===first||i===last))return;
    if(/^\s*(```|~~~)/.test(l)){inF=!inF;return}
    if(!inF&&/^\s*(?:>\s*)*(?:[-*+]|\d+[.)])\s+\[[ xX]\]/.test(l))idx.push(i);
  });
  return{lines,idx};
}
function taskCount(body){const{lines,idx}=taskIdx(body);let done=0;idx.forEach(i=>{if(/\[[xX]\]/.test(lines[i]))done++});return{tot:idx.length,done}}
function toggleTask(owner,i,on){
  const isHome=owner==='__home';const tgt=isHome?doc:N(owner);if(!tgt)return;
  const key=isHome?'about':'body';const{lines,idx}=taskIdx(tgt[key]);const li=idx[i];if(li==null)return;
  lines[li]=lines[li].replace(/\[[ xX]\]/,on?'[x]':'[ ]');tgt[key]=lines.join('\n');if(!isHome)tgt.updated=NOW();persist();
}
/* 程式碼區塊（```、````、~~~；結尾要同一種字元、長度不短於開頭）逐行拿掉，回傳 [剩下的文字, 區塊數] */
function stripCode(src){
  const out=[];let fence=null,n=0;
  src.split('\n').forEach(l=>{const m=l.match(/^\s{0,3}(`{3,}|~{3,})/);
    if(fence){if(m&&m[1][0]===fence[0]&&m[1].length>=fence.length&&/^\s*(`{3,}|~{3,})\s*$/.test(l))fence=null;return}
    if(m){fence=m[1];n++;return}
    out.push(l)});
  return [out.join('\n'),n];
}
/* 行內公式轉成看得懂的文字（摘要用） */
const TEXSYM={mid:'∣',vert:'∣',le:'≤',leq:'≤',ge:'≥',geq:'≥',ne:'≠',neq:'≠',times:'×',cdot:'·',approx:'≈',pm:'±',to:'→',rightarrow:'→',leftarrow:'←',Rightarrow:'⇒',perp:'⊥',infty:'∞',sum:'Σ',prod:'Π',
  alpha:'α',beta:'β',gamma:'γ',delta:'δ',Delta:'Δ',epsilon:'ε',varepsilon:'ε',theta:'θ',lambda:'λ',mu:'μ',pi:'π',rho:'ρ',sigma:'σ',tau:'τ',phi:'φ',psi:'ψ',omega:'ω',chi:'χ',hat:'',bar:'',tilde:''};
const SUB={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉','+':'₊','-':'₋'},SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺','-':'⁻'};
function texText(t){
  t=t.replace(/\\(?:frac|dfrac|tfrac)\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g,'$1/$2')
    .replace(/\\(?:text|mathrm|mathbf|mathit|textbf|operatorname|mathcal|mathbb)\s*\{([^{}]*)\}/g,'$1')
    .replace(/\\[!,;:> ]/g,' ').replace(/\\(?:left|right|big|Big)\b/g,'')
    .replace(/\\([A-Za-z]+)/g,(m,w)=>w in TEXSYM?TEXSYM[w]:w)
    .replace(/_\{([0-9+-]+)\}|_([0-9])/g,(m,a,b)=>[...(a||b)].map(c=>SUB[c]||c).join(''))
    .replace(/\^\{([0-9+-]+)\}|\^([0-9])/g,(m,a,b)=>[...(a||b)].map(c=>SUP[c]||c).join(''))
    .replace(/[{}]/g,'').replace(/⊥(\s*⊥)+/g,'⊥').replace(/\s+/g,' ').trim();
  return t.replace(/\s*∣\s*/g,' ∣ ');
}
function excerpt(body){
  let s=stripCode(stripFence(body))[0];
  s=s.replace(/\$\$[\s\S]*?\$\$/g,' ').replace(/\\\[[\s\S]*?\\\]/g,' ');
  s=s.split(/(`[^`\n]*`)/).map((p,i)=>i%2?p.slice(1,-1):p.replace(/\\\(([\s\S]+?)\\\)/g,(m,x)=>texText(x)).replace(/\$(?!\s)([^$\n]+?)\$/g,(m,x)=>texText(x))).join('');
  return s.replace(/^\s*\|?[\s:|-]*-{3,}[\s:|-]*$/gm,' ').replace(/^\s*-{3,}\s*$/gm,' ').replace(/!\[[^\]]*\]\([^)]*\)/g,' ')
    .replace(/\[([^\]]*)\]\([^)]*\)/g,'$1').replace(/^\s*(#+|>|[-*+]|\d+[.)])\s*(\[[ xX]\]\s*)?/gm,'').replace(/[*_`~|]/g,'').replace(/\s+/g,' ').trim().slice(0,110);
}

/* 把卡片放到 pid 底下（null＝首頁）；pos：'first'｜'last'｜{before:id}｜{after:id}。
   換到別張卡片底下算「使用者自己搬過」，模板的 moves 之後不會再動它 */
function moveTo(id,pid,pos){
  indexParents();if(!N(id))return false;
  if(pid!=null&&(!N(pid)||pid===id||descendants(id).includes(pid)))return false;
  const oldP=PARENT[id],from=kidsOf(oldP),i=from.indexOf(id);if(i<0)return false;
  from.splice(i,1);const to=kidsOf(pid);let idx=to.length;
  if(pos==='first')idx=0;
  else if(pos&&pos.before){const k=to.indexOf(pos.before);idx=k<0?to.length:k}
  else if(pos&&pos.after){const k=to.indexOf(pos.after);idx=k<0?to.length:k+1}
  to.splice(idx,0,id);
  if(pid!==oldP){delete doc.seedAt[id];if(pid!=null){expanded.add(pid);lsSet('exp',[...expanded])}}
  return true;
}
/* 「位置」下拉：最前面／在「某張」後面 */
function curPos(id){indexParents();const a=kidsOf(PARENT[id]),i=a.indexOf(id);return i<=0?'first':'after:'+a[i-1]}
function posOpts(id,pid){
  indexParents();const sib=kidsOf(pid).filter(k=>k!==id);
  const cv=PARENT[id]===pid?curPos(id):(sib.length?'after:'+sib[sib.length-1]:'first');
  let o='<option value="first"'+(cv==='first'?' selected':'')+'>最前面</option>';
  sib.forEach((k,j)=>{const v='after:'+k;o+='<option value="'+v+'"'+(cv===v?' selected':'')+'>在「'+esc(ttl(N(k)))+'」後面'+(j===sib.length-1?'（最後面）':'')+'</option>'});
  return o;
}
function placeAt(id,pid,pv){
  indexParents();if(PARENT[id]===pid&&pv===curPos(id))return false;
  return moveTo(id,pid,pv&&pv.indexOf('after:')===0?{after:pv.slice(6)}:'first');

/* 圖片：壓到最長邊 1600px 的白底 JPG */
function shrink(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const M=1600;const s=Math.min(1,M/Math.max(im.naturalWidth,im.naturalHeight));const w=Math.max(1,Math.round(im.naturalWidth*s)),h=Math.max(1,Math.round(im.naturalHeight*s));const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);res(c.toDataURL('image/jpeg',0.85))};im.onerror=()=>rej(new Error('讀不到圖片'));im.src=fr.result};fr.onerror=()=>rej(fr.error);fr.readAsDataURL(file)})}

  for(const f of list){try{formImgs.push({id:uid(),src:await shrink(f),cap:''})}catch(e){toast('有一張圖片讀不到')}}

    move(id,a==='up'?-1:1);const r=document.querySelector('.tn[data-tn="'+id+'"]');if(r)openTMenu(id,r);else closeTMenu();return}
  if(t.closest('[data-hold]'))return;
  if((b=t.closest('.md pre .cp'))){const code=b.parentElement.querySelector('code');const txt=(code||b.parentElement).textContent;
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('已複製')).catch(()=>toast('複製失敗，請手動選取'));return}
  if(t.matches('.md li > input[type=checkbox]'))return;
  if((b=t.closest('[data-fold]'))){const o=b.dataset.fold;bodyOpen.has(o)?bodyOpen.delete(o):bodyOpen.add(o);render();return}
  if((b=t.closest('[data-tip]'))){$('#'+b.dataset.tip).classList.toggle('on');return}
  if((b=t.closest('[data-save]'))){saveForm(b.closest('.form'));return}
  if((b=t.closest('[data-cancel]'))){cancelForm();return}
  if((b=t.closest('[data-drop]'))){$('#filePick').click();return}
  if((b=t.closest('[data-edit]'))){startEdit(b.dataset.edit);return}
  if((b=t.closest('[data-add]'))){if(editing)cancelForm();addCard(b.dataset.add===''?null:b.dataset.add);return}
  if((b=t.closest('[data-mv]'))){const[id,d]=b.dataset.mv.split('|');move(id,+d);return}
  if((b=t.closest('[data-view]'))){setView(cur,b.dataset.view);return}
  if((b=t.closest('#roBtn'))){reorder=!reorder;render();return}
  if((b=t.closest('#allBtn'))){const ids=kidsOf(cur);const all=ids.every(i=>openRows.has(i));ids.forEach(i=>all?openRows.delete(i):openRows.add(i));render();return}
  if((b=t.closest('[data-img]'))){const[o,i]=b.dataset.img.split('|');lbList=N(o).imgs;lbI=+i;lbShow();return}
  if((b=t.closest('[data-tg]'))){const id=b.dataset.tg;if(b.getAttribute('aria-expanded')==='true')expanded.delete(id);else expanded.add(id);lsSet('exp',[...expanded]);renderTree();return}
  if((b=t.closest('[data-tog]'))&&!t.closest('.ro')){const id=b.dataset.tog;openRows.has(id)?openRows.delete(id):openRows.add(id);render();return}
  if((b=t.closest('[data-go]'))&&!t.closest('.ro')){
    if(editing){const back=newOne;dropNew();editing=null;formImgs=[];if(back&&b.dataset.go===back)return render()}
    if(b.dataset.clrq){query='';$('#q').value=''}
    document.body.classList.remove('drawer');const id=b.dataset.go||null;
    go(id);return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('.md li > input[type=checkbox]')&&t.dataset.task){const[o,i]=t.dataset.task.split('|');toggleTask(o,+i,t.checked);
    setTimeout(render,0);return}
  if(t.id==='filePick'){addImgs(t.files);t.value='';return}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.cap!=null){const g=formImgs[+t.dataset.cap];if(g)g.cap=t.value;return}
  if(t.id==='q'){query=t.value.trim();editing=null;render();return}
});
document.addEventListener('paste',e=>{
  if(!e.target.closest||!e.target.closest('.form[data-form]')||e.target.closest('[data-form="__home"]'))return;
  const items=[...(e.clipboardData&&e.clipboardData.items||[])].filter(it=>it.kind==='file'&&/^image\//.test(it.type));
  if(!items.length)return;e.preventDefault();addImgs(items.map(it=>it.getAsFile()));
});
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('[data-drop]');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('[data-drop]');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('[data-drop]');if(!d)return;e.preventDefault();d.classList.remove('over');addImgs(e.dataTransfer.files)});
document.addEventListener('keydown',e=>{
  if($('#lbx').classList.contains('on')){if(e.key==='Escape')lbClose();else if(e.key==='ArrowLeft'&&lbList.length>1){lbI=(lbI-1+lbList.length)%lbList.length;lbShow()}else if(e.key==='ArrowRight'&&lbList.length>1){lbI=(lbI+1)%lbList.length;lbShow()}return}
  if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){const f=e.target.closest&&e.target.closest('.form');if(f){e.preventDefault();saveForm(f)}}
  if(e.key==='Escape'&&$('#mvdlg').classList.contains('on')){closeMove();return}
  if(e.key==='Escape'&&tmId!==null){closeTMenu();return}
  if(e.key==='Escape'&&editing){cancelForm()}
});
/* 「移到…」視窗 */
$('#mvParent').addEventListener('change',()=>{if(mvId)$('#mvPos').innerHTML=posOpts(mvId,$('#mvParent').value||null)});
$('#mvCancel').onclick=closeMove;
$('#mvdlg').addEventListener('click',e=>{if(e.target.id==='mvdlg')closeMove()});
$('#mvOk').onclick=()=>{
  const id=mvId;if(!id||!N(id)){closeMove();return}
  const pid=$('#mvParent').value||null;indexParents();const oldP=PARENT[id];
  if(placeAt(id,pid,$('#mvPos').value)){persist();render();toast(pid!==oldP?(pid==null?'已移到首頁':'已移到「'+ttl(N(pid))+'」底下'):'已調整位置')}
  closeMove();
};
/* 表單裡換了上層，位置下拉跟著換 */
document.addEventListener('change',e=>{const t=e.target;if(t.matches&&t.matches('.form [data-f=parent]')){const f=t.closest('.form'),ps=f.querySelector('[data-f=pos]');if(ps)ps.innerHTML=posOpts(f.dataset.form,t.value||null)}});
/* 目錄拖曳（電腦）：上 1/3 放前面、下 1/3 放後面、中間放進它底下 */
let dragId=null;
function dzClear(){document.querySelectorAll('.tn.dz-before,.tn.dz-after,.tn.dz-into').forEach(x=>x.classList.remove('dz-before','dz-after','dz-into'))}
function dzOf(e,row){
  const tid=row.dataset.tn;if(!dragId)return null;
  if(tid===''){return 'into'}
  if(tid===dragId||descendants(dragId).includes(tid))return null;
  const r=row.getBoundingClientRect(),y=(e.clientY-r.top)/r.height;
  return y<0.3?'before':y>0.7?'after':'into';
}
$('#tree').addEventListener('dragstart',e=>{const row=e.target.closest&&e.target.closest('.tn[data-tn]');if(!row||!row.dataset.tn||readOnly)return;
  dragId=row.dataset.tn;indexParents();closeTMenu();row.classList.add('dragging');
  try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId)}catch(_){}});
$('#tree').addEventListener('dragover',e=>{const row=e.target.closest&&e.target.closest('.tn[data-tn]');if(!row||!dragId)return;
  const z=dzOf(e,row);dzClear();if(!z)return;e.preventDefault();try{e.dataTransfer.dropEffect='move'}catch(_){}row.classList.add('dz-'+z)});
$('#tree').addEventListener('dragleave',e=>{const row=e.target.closest&&e.target.closest('.tn[data-tn]');if(row&&!row.contains(e.relatedTarget))row.classList.remove('dz-before','dz-after','dz-into')});
$('#tree').addEventListener('drop',e=>{const row=e.target.closest&&e.target.closest('.tn[data-tn]');if(!row||!dragId)return;e.preventDefault();
  const z=dzOf(e,row),id=dragId,tid=row.dataset.tn;dzClear();dragId=null;if(!z)return;
  indexParents();const oldP=PARENT[id];let pid,pos;
  if(z==='into'){pid=tid===''?null:tid;pos='last'}else{pid=PARENT[tid];pos=z==='before'?{before:tid}:{after:tid}}
  if(pid===oldP&&pos!=='last'&&((pos.before&&kidsOf(pid)[kidsOf(pid).indexOf(tid)-1]===id)||(pos.after&&kidsOf(pid)[kidsOf(pid).indexOf(tid)+1]===id)))return render();
  if(moveTo(id,pid,pos)){persist();render();toast(pid!==oldP?(pid==null?'已移到首頁':'已移到「'+ttl(N(pid))+'」底下'):'已調整順序')}});
$('#tree').addEventListener('dragend',()=>{dragId=null;dzClear();document.querySelectorAll('.tn.dragging').forEach(x=>x.classList.remove('dragging'))});
/* 目錄長按（手機）：0.5 秒跳出小選單 */
let lpT=null,lpX=0,lpY=0,lpFired=false;
$('#tree').addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'||readOnly)return;const row=e.target.closest('.tn[data-tn]');if(!row||!row.dataset.tn)return;
  lpX=e.clientX;lpY=e.clientY;clearTimeout(lpT);
  lpT=setTimeout(()=>{lpT=null;lpFired=true;setTimeout(()=>{lpFired=false},800);openTMenu(row.dataset.tn,row);try{if(navigator.vibrate)navigator.vibrate(10)}catch(_){}},500)});
['pointerup','pointercancel'].forEach(ev=>$('#tree').addEventListener(ev,()=>{clearTimeout(lpT);lpT=null}));
$('#tree').addEventListener('pointermove',e=>{if(lpT&&(Math.abs(e.clientX-lpX)>8||Math.abs(e.clientY-lpY)>8)){clearTimeout(lpT);lpT=null}},{passive:true});
$('#tree').addEventListener('contextmenu',e=>{if(e.target.closest('.tn[data-tn]'))e.preventDefault()});
$('#tree').addEventListener('scroll',()=>{if(tmId!==null)closeTMenu()});
$('#lbx').addEventListener('click',e=>{if(e.target.id==='lbPrev'){lbI=(lbI-1+lbList.length)%lbList.length;lbShow()}else if(e.target.id==='lbNext'){lbI=(lbI+1)%lbList.length;lbShow()}else if(e.target.id!=='lbImg')lbClose()});
$('#qClr').onclick=()=>{query='';$('#q').value='';render()};
$('#addRoot').onclick=()=>{if(editing)cancelForm();document.body.classList.remove('drawer');addCard(null)};
$('#sTitle').onclick=()=>{document.body.classList.remove('drawer');go(null)};
$('#menuBtn').onclick=()=>document.body.classList.toggle('drawer');
$('#scrim').onclick=()=>document.body.classList.remove('drawer');
$('#fsDn').onclick=()=>{fsIdx=Math.max(0,fsIdx-1);lsSet('fs',fsIdx);render()};
$('#fsUp').onclick=()=>{fsIdx=Math.min(SCALES.length-1,fsIdx+1);lsSet('fs',fsIdx);render()};
window.addEventListener('hashchange',()=>{closeTMenu();if(keepEdit){keepEdit=false}else if(editing){const back=newOne;dropNew();editing=null;formImgs=[];if(back)persist()}reorder=false;render();window.scrollTo(0,0)});

/* ================= 啟動 ================= */
(async function init(){
  let d=await Store.get('doc');let fresh=false;
  if(d===undefined||d===null){
    d=blankDoc();fresh=true;
    if(SEED){['title','sub','about'].forEach(k=>{if(typeof SEED[k]==='string'&&SEED[k])d[k]=SEED[k]});if(SEED.view==='list')d.view='list';if(SEED.fold)d.fold=true}
  }else if(typeof d!=='object'||d.schema!=='epi-notebook'){readOnly=true;d=blankDoc()}
  doc=normalize(d);
  const ch=mergeSeed(doc,SEED);
  const mvd=!readOnly&&applyMoves(doc,SEED);
  normalize(doc);
  if((fresh||ch||mvd)&&!readOnly)persist();
  render();
})();
</script>
</body>
</html>
